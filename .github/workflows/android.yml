name: Android GDExtension

on:
  workflow_dispatch:

env:
  vcpkg_tag: ddd0023b0eee70986e42ed49d9d4afb8098f212e # 2026.08.25

jobs:
  build:
    name: Android (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install tools
        shell: bash
        run: |
          python -m pip install "scons<4.8"
          pip install ply

      - name: Install NDK (28.1.13356709)
        shell: bash
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/ndk"
          curl -fsSL https://dl.google.com/android/repository/android-ndk-r28b-linux.zip -o /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /tmp/ndk
          mv /tmp/ndk/android-ndk-r28b "$ANDROID_SDK_ROOT/ndk/28.1.13356709"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.1.13356709" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.1.13356709" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.vcpkg_tag }}

      - name: Build
        shell: bash
        env:
          VCPKG_BINARY_SOURCES: clear
        run: |
          cd gdext
          scons api_version=4.7 platform=android arch=${{ matrix.arch }} target=template_debug godot-cpp
          scons api_version=4.7 platform=android arch=${{ matrix.arch }} target=template_debug
          scons api_version=4.7 platform=android arch=${{ matrix.arch }} target=template_release godot-cpp
          scons api_version=4.7 platform=android arch=${{ matrix.arch }} target=template_release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: imgui-godot-android-${{ matrix.arch }}
          path: addons/imgui-godot/bin